name: Format mobile panel branch

on:
  push:
    branches: [fix/mobile-flight-panel-actions]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-flight-panel-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write index.html js/panel-interaction-fix.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/panel-interaction-fix.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format mobile panel fixes"
          git push origin HEAD:fix/mobile-flight-panel-actions
