name: Format AirLabs branch

on:
  push:
    branches: [feature/airlabs-flight-status]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/airlabs-flight-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write functions/api/flight-status.js js/flight-status-integration.js tests/airlabs-integration.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/flight-status.js js/flight-status-integration.js tests/airlabs-integration.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format AirLabs integration"
          git push origin HEAD:feature/airlabs-flight-status
