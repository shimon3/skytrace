<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>SkyTrace Admin</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f16;
        color: #e8eef8;
      }
      main {
        width: min(760px, calc(100% - 32px));
      }
      .card {
        background: #121925;
        border: 1px solid #243044;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin-top: 0;
        font-size: 24px;
      }
      p {
        color: #9fb0c7;
      }
      form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      input {
        flex: 1 1 320px;
        border: 1px solid #31415b;
        background: #0d131d;
        color: #fff;
        border-radius: 10px;
        padding: 12px 14px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        background: #2fe6a8;
        color: #06110d;
        font-weight: 700;
        cursor: pointer;
      }
      #error {
        color: #ff7b92;
        min-height: 24px;
      }
      #dashboard {
        display: none;
        margin-top: 22px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }
      .metric {
        background: #0d131d;
        border: 1px solid #243044;
        border-radius: 12px;
        padding: 16px;
      }
      .metric small {
        color: #8da0ba;
        display: block;
        margin-bottom: 8px;
      }
      .metric strong {
        font-size: 28px;
      }
      progress {
        width: 100%;
        height: 14px;
        margin-top: 18px;
      }
      .muted {
        font-size: 13px;
        color: #7f91aa;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>SkyTrace — Administration API</h1>
        <p>Cette page est protégée par le jeton administrateur configuré dans Cloudflare.</p>
        <form id="login-form">
          <input
            id="admin-token"
            type="password"
            autocomplete="current-password"
            placeholder="Jeton administrateur"
            required
          />
          <button type="submit">Afficher les statistiques</button>
        </form>
        <div id="error" role="alert"></div>
        <div id="dashboard">
          <div class="grid">
            <div class="metric">
              <small>Requêtes envoyées aujourd’hui</small><strong id="requests">—</strong>
            </div>
            <div class="metric">
              <small>Requêtes restantes</small><strong id="remaining">—</strong>
            </div>
            <div class="metric"><small>Succès</small><strong id="successes">—</strong></div>
            <div class="metric"><small>Échecs</small><strong id="failures">—</strong></div>
            <div class="metric">
              <small>Réponses servies depuis le cache</small><strong id="cache-hits">—</strong>
            </div>
            <div class="metric">
              <small>Blocages quota</small><strong id="quota-blocked">—</strong>
            </div>
          </div>
          <progress id="quota-progress" max="500" value="0"></progress>
          <p id="quota-text"></p>
          <p class="muted" id="details"></p>
          <button id="refresh" type="button">Actualiser</button>
        </div>
      </section>
    </main>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
