name: Format cache-bust branch

on:
  push:
    branches: [fix/cache-bust-mobile-panel]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cache-bust-mobile-panel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write tests/airlabs-integration.test.js tests/project-contract.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/airlabs-integration.test.js tests/project-contract.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format cache-busting tests"
          git push origin HEAD:fix/cache-bust-mobile-panel
